# Place these directives inside your Nginx server block.
root /home/username/orders.example.com/dist;
index index.html;

# Home page: shared notice or default-company redirect.
location = / {
    rewrite ^ /index.html last;
}

# Valid portal routes. Keep in sync with src/main.js.
location ~ ^/c[1-9][0-9]*(?:/status(?:/[^/]+)?)?/?$ {
    rewrite ^ /index.html last;
}

# Serve public files normally; render unknown URLs through Vue with HTTP 404.
location / {
    error_page 404 /index.html;
    try_files $uri =404;
}

# Prevent stale application entry points.
location = /index.html {
    expires -1;
}

# Hashed Vite bundles.
location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
}

# Company branding.
location ^~ /company-assets/ {
    try_files $uri =404;
    expires 1h;
}
